{% set name = "pytest" %}
{% set version = "9.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8f44522eafe4137b0f35c9ce3072931a788a21ee40a2ed279e817d3cc16ed21e

build:
  skip: true  # [py<310]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - pytest=pytest:console_main
    - py.test=pytest:console_main
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}

requirements:
  host:
    - pip
    - python
    - setuptools >=77
    - setuptools-scm >=6.2.3
    - toml
  run:
    - python
    - iniconfig >=1.0.1
    - packaging >=22
    - pluggy >=1.5,<2
    - colorama >=0.4  # [win]
    - exceptiongroup >=1  # [py<311]
    - tomli >=1  # [py<311]
    - pygments >=2.7.2
  run_constrained:
    # pytest-faulthandler 2 is a dummy package.
    # if an older version of fault-handler is installed, it will conflict with pytest >=5.
    - pytest-faulthandler >=2
    - attrs >=19.2
    - hypothesis >=3.56

test:
  source_files:
    - testing
    - src
  imports:
    - pytest
    - _pytest
    - _pytest._code
    - _pytest._io
    - _pytest._py
    - _pytest.assertion
    - _pytest.config
    - _pytest.mark
  requires:
    - pip
    - pytest
  commands:
    - pytest -h
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest testing -v --markers --fixtures --ignore=testing/example_scripts

about:
  home: https://docs.pytest.org
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Simple and powerful testing with Python.
  description: |
    The pytest framework makes it easy to write small tests, yet scales to
    support complex functional testing for applications and libraries.
  doc_url: https://docs.pytest.org
  dev_url: https://github.com/pytest-dev/pytest

extra:
  recipe-maintainers:
    - flub
    - goanpeca
    - nicoddemus
    - ocefpaf
    - mingwandroid
